name: "Backend-Depolyment"

on: 
   push:
      branches: ["main"]
      paths:  
      - "backend/**"


jobs:
  CD-deployment:
     runs-on: ubuntu-latest

     steps:
       - name: "Checkout the code"
         uses: action/checkout@v4

       
       - name: "Configuration to the Aws"
         uses: aws-action/configure-aws-credentails@v4
         with:
                aws-access-key-id: ${{secrets.AWS_ACCES_KEY}}
                aws-secret-access-key: ${{ secrets.AWS_SECERET_KEY }}
                aws-region: ${{secrets.Aws_REGION}}

       - name: "SSh to the Ec2"
         uses: appleboy/ssh-action@v4
         with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USER }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}   
            script: | 
               cd web_deplyment_Aws/
               git pull
               npm i
               npx prisma migrate deploy
               npx prisma generate
               pm2 restart server

          

