name: "Backend CI/CD"

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"

jobs:
  ci-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Install dependencies"
        run: |
          cd backend
          npm ci

      - name: "Generate Prisma client"
        run: |
          cd backend
          npx prisma generate

      - name: "Run audit"
        run: |
          cd backend
          npm audit || true

  deploy:
    runs-on: ubuntu-latest
    needs: ci-test

    steps:
      - name: "Deploy to EC2"
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/web_deplyment_Aws
            git pull origin main
            cd backend
            npm ci --production
            npx prisma generate
            npx prisma migrate deploy
            pm2 restart backend || pm2 start server.js --name backend

      - name: "Verify deployment"
        run: |
          sleep 10
          curl -f http://${{ secrets.EC2_HOST }}:5000/health || echo "Health check failed"
